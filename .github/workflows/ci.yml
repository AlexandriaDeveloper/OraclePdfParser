name: Build and test
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore and build API
        run: dotnet build src/OraclePdfParser.Api/OraclePdfParser.Api.csproj --configuration Release
      - name: Test parser and PDFium extraction
        run: dotnet test tests/OraclePdfParser.Tests/OraclePdfParser.Tests.csproj --configuration Release --logger "console;verbosity=normal"
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Angular
        run: npm install --no-audit --no-fund
      - name: Strict type check
        run: npm run test
      - name: Production build
        run: npm run build
