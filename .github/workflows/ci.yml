name: Build and test
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
jobs:
  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet --info
      - run: dotnet test tests/OraclePdfParser.Tests/OraclePdfParser.Tests.csproj --configuration Release
      - run: dotnet build src/OraclePdfParser.Api/OraclePdfParser.Api.csproj --configuration Release
      - run: dotnet build tools/OraclePdfParser.Verify/OraclePdfParser.Verify.csproj --configuration Release
      - name: Publish Windows x64 API
        if: matrix.os == 'windows-latest'
        run: dotnet publish src/OraclePdfParser.Api/OraclePdfParser.Api.csproj --configuration Release --runtime win-x64 --self-contained false --output publish/win-x64
  angular:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
